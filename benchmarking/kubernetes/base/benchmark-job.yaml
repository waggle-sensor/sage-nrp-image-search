apiVersion: batch/v1
kind: Job
metadata:
  name: benchmark-job
  labels:
    app: benchmark-job
spec:
  # Don't automatically delete completed jobs (for debugging)
  ttlSecondsAfterFinished: 86400  # 24 hours
  # Allow only one job to run at a time
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: benchmark-job
    spec:
      restartPolicy: Never
      containers:
        - name: benchmark-job
          image: PLACEHOLDER_BENCHMARK_JOB_IMAGE:latest
          # Note: Vector DB and inference server environment variables should be
          # added via patches in benchmark-specific overlays (e.g., env.yaml)
          command: ["python", "run_benchmark.py"]
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONPATH
              value: "/app"
            # S3 upload configuration (base defaults)
            - name: S3_ENDPOINT
              value: "http://rook-ceph-rgw-nautiluss3.rook" #inside cluster endpoint of the s3 bucket
            - name: S3_BUCKET
              value: "sage_imsearch"
            - name: S3_SECURE
              value: "false" # inside cluster endpoint doesn't use SSL
            - name: S3_PREFIX
              value: "dev-metrics" # Override in benchmark-specific overlays
            - name: UPLOAD_TO_S3
              value: "true"
            # model provider configuration
            - name: LLM_MODEL_PROVIDER
              value: "nrp" #or triton
            # LLM captioning image prep configuration
            - name: LLM_IMAGE_BYTE_LIMITING
              value: "true"
            - name: LLM_MAX_IMAGE_BYTES
              value: "12582912" # 12MB
            - name: LLM_MAX_IMAGE_SIDE
              value: "6144"
            # LLM batching configuration
            - name: WORKERS
              value: "8"
            - name: QUERY_BATCH_SIZE
              value: "8"
            - name: IMAGE_BATCH_SIZE
              value: "32"
            # query/response limiting configuration
            - name: RESPONSE_LIMIT
              value: "25"
            # Query-only reuse of an existing collection (do not drop / recaption)
            - name: SKIP_INDEX
              value: "false"
          envFrom:
            - secretRef:
                name: s3-secret
            - secretRef:
                name: huggingface-secret
            - secretRef:
                name: nrp-secret
            - secretRef:
                name: milvus-secret
          resources:
            limits:
              cpu: 9  # maximum allowed ratio of 1.2x of requests (8 * 1.2 = 9.6)
              memory: 28Gi  # maximum allowed ratio of 1.2x of requests (24Gi * 1.2 = 28.8Gi)
              ephemeral-storage: 30Gi
            requests:
              cpu: 8
              memory: 24Gi
              ephemeral-storage: 25Gi
          volumeMounts:
            - name: huggingface-cache
              mountPath: /root/.cache/huggingface
            - name: results
              mountPath: /app/results
      volumes:
        - name: huggingface-cache
          emptyDir: {}
        - name: results
          emptyDir: {}

