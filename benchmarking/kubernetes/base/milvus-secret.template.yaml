apiVersion: v1
kind: Secret
metadata:
  name: milvus-secret
  labels:
    app: benchmark-job
type: Opaque
data:
  # Base64 encoded MILVUS_URI and MILVUS_TOKEN
  # TLS gRPC endpoint. Use https:// not http://
  # To generate: echo -n "https://milvus.nrp-nautilus.io:50051" | base64
  # To generate: echo -n "username:password" | base64
  MILVUS_URI: ""  # Replace with base64 encoded URI
  MILVUS_TOKEN: ""  # Replace with base64 encoded token (username:password)
