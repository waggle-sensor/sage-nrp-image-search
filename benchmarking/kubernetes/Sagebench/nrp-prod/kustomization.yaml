apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sage

namePrefix: prod-sagebench-
commonLabels:
  benchmark: sagebench

# This overlay references the base and applies Sagebench-specific patches
resources:
  - ../../base

patches:
  # Patch job environment variables (Sagebench-specific + prod services)
  - path: env.yaml
    target:
      kind: Job
      labelSelector: "app=benchmark-job"

images:
  - name: PLACEHOLDER_BENCHMARK_JOB_IMAGE
    newName: gitlab-registry.nrp-nautilus.io/ndp/sage/nrp-image-search/benchmark-sagebench-job
    newTag: pr-20
