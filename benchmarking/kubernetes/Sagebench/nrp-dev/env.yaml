apiVersion: batch/v1
kind: Job
metadata:
  name: benchmark-job
spec:
  template:
    spec:
      containers:
        - name: benchmark-job
          env:
            # Vector DB configuration (Weaviate)
            - name: WEAVIATE_HOST
              value: "dev-weaviate.sage.svc.cluster.local"
            - name: VECTOR_DB
              value: "milvus"
            - name: MILVUS_DB
              value: "image_search_svc"
            # Inference server configuration (Triton)
            - name: TRITON_HOST
              value: "dev-triton.sage.svc.cluster.local"
            # S3 upload configuration (override base defaults for this benchmark)
            - name: S3_PREFIX
              value: "dev-metrics/sagebench"
            - name: WORKERS
              value: "16"
            - name: QUERY_BATCH_SIZE
              value: "16"
            - name: IMAGE_BATCH_SIZE
              value: "32"
            - name: LOG_LEVEL
              value: "DEBUG"
            - name: RESPONSE_LIMIT
              value: "25"
            - name: LLM_MODEL_PROVIDER
              value: "nrp" #or triton
            - name: CAPTION_MODEL_NAME
              value: "gemma"
            - name: NRP_ENABLE_THINKING
              value: "false"