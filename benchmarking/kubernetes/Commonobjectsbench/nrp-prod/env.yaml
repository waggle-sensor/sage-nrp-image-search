apiVersion: batch/v1
kind: Job
metadata:
  name: benchmark-job
spec:
  template:
    spec:
      containers:
        - name: benchmark-job
          env:
            # Vector DB configuration (Weaviate) - prod environment
            - name: WEAVIATE_HOST
              value: "prod-weaviate.sage.svc.cluster.local"
            - name: VECTOR_DB
              value: "milvus"
            - name: MILVUS_DB
              value: "image_search_svc"
            # Inference server configuration (Triton) - prod environment
            - name: TRITON_HOST
              value: "prod-triton.sage.svc.cluster.local"
            # S3 upload configuration (override base defaults for this benchmark)
            - name: S3_PREFIX
              value: "prod-metrics/commonobjectsbench"
            # - name: S3_PREFIX # Uncomment this if you want to use the private dataset
            #   value: "prod-metrics/commonobjectsbench_priv"
            - name: LOG_LEVEL
              value: "INFO"
            - name: COMMONOBJECTSBENCH_USE_PRIVATE
              value: "true"
