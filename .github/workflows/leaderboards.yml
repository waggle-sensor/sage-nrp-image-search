name: Rebuild Benchmark Leaderboards

on:
  push:
    branches:
      - main
    paths:
      - 'benchmarking/benchmarks/**/results/**'
      - 'benchmarking/helpers/plot.py'
      - '.github/workflows/leaderboards.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'benchmarking/benchmarks/**/results/**'
      - 'benchmarking/helpers/plot.py'
      - '.github/workflows/leaderboards.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild-leaderboards:
    runs-on: ubuntu-latest
    env:
      # PRs: source branch; push / workflow_dispatch: branch that was checked out
      LEADERBOARD_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install leaderboard dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy matplotlib jupyter nbconvert

      - name: Execute benchmark leaderboard notebooks
        run: |
          for nb in benchmarking/benchmarks/*/results/leaderboard.ipynb; do
            if [ -f "$nb" ] && [[ "$nb" != benchmarking/benchmarks/template/* ]]; then
              jupyter nbconvert --to notebook --execute --inplace "$nb"
            fi
          done

      - name: Execute overall leaderboard notebook
        run: |
          jupyter nbconvert --to notebook --execute --inplace "benchmarking/benchmarks/overall/leaderboard.ipynb"

      - name: Commit and push rebuilt leaderboards
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for f in benchmarking/benchmarks/*/results/leaderboard.ipynb; do
            if [ -f "$f" ] && [[ "$f" != benchmarking/benchmarks/template/* ]]; then
              git add -- "$f"
            fi
          done
          if [ -f benchmarking/benchmarks/overall/leaderboard.ipynb ]; then
            git add -- benchmarking/benchmarks/overall/leaderboard.ipynb
          fi

          if git diff --staged --quiet; then
            echo "No leaderboard notebook changes to commit."
            exit 0
          fi

          # [skip ci] avoids re-triggering this workflow (results live under results/)
          git commit -m "chore: rebuild benchmark leaderboard notebooks [skip ci]"
          git push origin "HEAD:${LEADERBOARD_BRANCH}"
