apiVersion: batch/v1
kind: Job
metadata:
  name: weavmanage
  labels:
    app: weavmanage
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: weavmanage
    spec:
      restartPolicy: Never
      containers:
        - name: weavmanage
          image: gitlab-registry.nrp-nautilus.io/ndp/sage/nrp-image-search/weavmanage:latest
          env:
            - name: MILVUS_DB
              value: "image_search_svc"
            - name: MILVUS_COLLECTION
              value: "SageImageSearch"
          envFrom:
            - secretRef:
                name: milvus-secret
          resources:
            limits:
              cpu: 4
              memory: 8Gi
            requests:
              cpu: 4
              memory: 8Gi
