apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sage

resources:
  - ._huggingface-secret.yaml
  - ._sage-user-secret.yaml
  - ._nrp-llm-user-secret.yaml
  - ._milvus-secret.yaml
  - triton.yaml
  - gradio-ui.yaml
  - weavmanage.yaml
  - weavloader.yaml
vars:
  - name: TRITON_SERVICE
    objref:
      kind: Service
      name: triton
      apiVersion: v1
    fieldref:
      fieldpath: metadata.name
