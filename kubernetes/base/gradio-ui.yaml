apiVersion: apps/v1
kind: Deployment
metadata:
  name: gradio-ui
  labels:
    app: gradio-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gradio-ui
  template:
    metadata:
      labels:
        app: gradio-ui
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: gradio-ui
          image: gitlab-registry.nrp-nautilus.io/ndp/sage/nrp-image-search/gradio-ui:latest
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: MILVUS_DB
              value: "image_search_svc"
            - name: MILVUS_COLLECTION
              value: "SageImageSearch"
            - name: CLUSTER_FLAG
              value: "True"
            - name: TRITON_HOST
              value: "$(TRITON_SERVICE)"
            - name: TRITON_PORT
              value: "8001"
          envFrom:
          - secretRef:
              name: sage-user-secret
          - secretRef:
              name: milvus-secret
          resources:
            limits:
              cpu: 1
              memory: 5Gi
            requests:
              cpu: 1
              memory: 5Gi
          ports:
          - name: http
            containerPort: 7860
          - name: metrics
            containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: gradio-ui
  labels:
    app: gradio-ui
spec:
  ports:
    - name: http
      port: 7860
      targetPort: 7860
    - name: metrics
      port: 8080
      targetPort: 8080
  selector:
    app: gradio-ui
