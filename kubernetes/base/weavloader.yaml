apiVersion: apps/v1
kind: Deployment
metadata:
  name: weavloader
  labels:
    app: weavloader
spec:
  replicas: 1
  selector:
    matchLabels:
      app: weavloader
  template:
    metadata:
      labels:
        app: weavloader
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: weavloader
          image: gitlab-registry.nrp-nautilus.io/ndp/sage/nrp-image-search/weavloader:latest
          imagePullPolicy: Always #TODO: remove once done with dev
          ports:
            - containerPort: 8080
              name: metrics
          env:
            - name: MILVUS_DB
              value: "image_search_svc"
            - name: MILVUS_COLLECTION
              value: "SageImageSearch"
            - name: TRITON_HOST
              value: "$(TRITON_SERVICE)"
            - name: TRITON_PORT
              value: "8001"
            - name: LOG_LEVEL
              value: "INFO"
            - name: MONITOR_DATA_STREAM_INTERVAL
              value: "60.0"
            - name: PROCESS_DLQ_INTERVAL
              value: "86400.0"
            - name: LLM_RUN_MODE
              value: "NRP"
            - name: NRP_LLM_MODEL
              value: "gemma"
            - name: NRP_ENABLE_THINKING
              value: "false"
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: huggingface-secret
                  key: token
          envFrom:
            - secretRef:
                name: sage-user-secret
            - secretRef:
                name: nrp-llm-user-secret
            - secretRef:
                name: milvus-secret
          resources:
            limits:
              cpu: 2
              memory: 6Gi
            requests:
              cpu: 1
              memory: 5Gi
          volumeMounts:
            - name: redis-data
              mountPath: /var/lib/redis
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: weavloader-redis-pvc
      restartPolicy: Always
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: weavloader-redis-pvc
  labels:
    app: weavloader
  namespace: sage
spec:
  storageClassName: rook-ceph-block-central
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: weavloader-metrics
  labels:
    app: weavloader
    component: metrics
spec:
  selector:
    app: weavloader
  ports:
    - name: metrics
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: flower
      port: 5555
      targetPort: 5555
      protocol: TCP
